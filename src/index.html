<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Repair Hub</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Repair Hub: a multi-vendor mobile phone repair and pickup/delivery platform built with Angular."
    />
    <meta name="theme-color" content="#006a6a" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before Angular boots to avoid a light flash in dark mode.
      try {
        var t = localStorage.getItem('repairhub.theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark-theme');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
